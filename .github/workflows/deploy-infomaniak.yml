# Despliegue a Infomaniak (puzzle.cinemafilmak.com) en cada push a main.
# Mantiene la convención del proyecto: deploy = git push.
#
# Secrets necesarios en GitHub (Settings → Secrets and variables → Actions):
#   FTP_HOST      p.ej. ftp.cinemafilmak.com
#   FTP_USER      usuario FTP RESTRINGIDO a la carpeta del subdominio
#   FTP_PASSWORD  su contraseña
#   FTP_DIR       carpeta destino dentro de ese usuario (p.ej. / o /puzzle)
#
# A PROPÓSITO no lleva --delete: un despliegue que solo añade y sobrescribe es
# inofensivo aunque los secrets apunten donde no deben. Si algún día hace falta
# limpiar ficheros viejos del servidor, se borran a mano por FTP.
name: Deploy a Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infomaniak
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Preparar lo que se publica
        run: |
          mkdir -p _site
          cp index.html webar.html realizacion-nivel1.html _site/
          # los medios (vídeos, fotos 360) viven dentro del propio subdominio
          if [ -d media ]; then cp -r media _site/; fi
          ls -la _site

      - name: Subir por FTPS
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open -u \"$U\",\"$P\" \"$H\";
            mirror -R --delete --verbose --parallel=2 \
              --exclude-glob .git* \
              _site \"$D\";
          "
